<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <main>
      <h1>Welcome Back</h1>

      <form>
        <div>
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <div id="statustext"></div>

        <div class="button-group">
          <button type="button" onclick="handleRegister()">Register</button>
          <button type="button" onclick="handleLogin()">Login</button>
        </div>
      </form>
    </main>

    <script>

      document.getElementById("statustext").style.display="none";

      async function handleRegister() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const st = document.getElementById("statustext");

        st.style.display="none";

        if (!username || !password) {
          st.style.display="block";
          st.textContent = "FIELDS CANNOT BE EMPTY";
          return;
        }

        if(username.length > 100)
        {
          st.style.display="block";
          st.textContent = "USERNAME SHOULD HAVE MAX 100 CHARACTERS"
          return
        }

        if(password.length > 72)
        {
          st.style.display="block";
          st.textContent = "PASSWORD SHOULD HAVE MAX 72 CHARACTERS"
          return
        }

        const response = await fetch("/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username, password})
        });


        const data = await response.json();
        if(data["message"] === "user_created")
        {
          sessionStorage.setItem("token", data["token"]);
          sessionStorage.setItem("new_user", "true");
          window.location.href = "home.html";
        }
        if(data["message"] === "duplicate_username")
        {
          st.style.display="block";
          st.textContent = "USERNAME ALREADY EXISTS"
        }
        if(data["message"] === "database_error")
        {
          st.style.display="block";
          st.textContent = "COULD NOT CONNECT TO DATABASE"
        }
      }

      async function handleLogin() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const st = document.getElementById("statustext");

        st.style.display="none";

        if (!username || !password) {
          st.style.display="block";
          st.textContent = "FIELDS CANNOT BE EMPTY";
          return;
        }

        if(username.length > 100)
        {
          st.style.display="block";
          st.textContent = "USERNAME SHOULD HAVE MAX 100 CHARACTERS"
          return
        }

        if(password.length > 72)
        {
          st.style.display="block";
          st.textContent = "PASSWORD SHOULD HAVE MAX 72 CHARACTERS"
          return
        }

        const response = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username, password})
        });


        const data = await response.json();
        if(data["message"] === "correct_password")
        {
          sessionStorage.setItem("token", data["token"]);
          sessionStorage.setItem("new_user", "false");
          window.location.href = "/home.html";
        }
        if(data["message"] === "wrong_password")
        {
          st.style.display="block";
          st.textContent = "INVALID PASSWORD"
        }
        if(data["message"] === "user_notfound")
        {
          st.style.display="block";
          st.textContent = "NO USER FOUND"
        }
        if(data["message"] === "database_error")
        {
          st.style.display="block";
          st.textContent = "COULD NOT CONNECT TO DATABASE"
        }
      }
    </script>
  </body>
</html>
